<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruffle Flash Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #ruffle-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 600px;
        }
        
        #loading {
            color: white;
            font-size: 20px;
            text-align: center;
        }
        
        .error {
            color: #ff6b6b;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Loading Ruffle...</div>
    </div>

    <!-- Load Ruffle from CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        
        window.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("container");
            const loadingDiv = document.getElementById("loading");
            
            try {
                // Create Ruffle player
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                
                // Configure player
                player.id = "ruffle-container";
                
                // Replace loading message with player
                container.innerHTML = "";
                container.appendChild(player);
                
                // Load the SWF file
                // Replace 'game.swf' with your actual SWF file name
                const swfUrl = "game.swf";
                
                player.load(swfUrl).then(() => {
                    console.log("SWF loaded successfully");
                }).catch((error) => {
                    console.error("Error loading SWF:", error);
                    container.innerHTML = `
                        <div class="error">
                            <h2>Error Loading Game</h2>
                            <p>Could not load ${swfUrl}</p>
                            <p>Please ensure the SWF file exists in the assets folder.</p>
                        </div>
                    `;
                });
                
            } catch (error) {
                console.error("Error initializing Ruffle:", error);
                container.innerHTML = `
                    <div class="error">
                        <h2>Error Initializing Ruffle</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
